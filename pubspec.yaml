name: shafici_pos
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.12.1


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_svg: ^2.3.0
  flutter_secure_storage: ^11.0.0
  jwt_decoder: ^2.0.1
  lottie: ^3.5.1
  flutter_staggered_grid_view: ^0.7.0
  provider: ^6.1.5+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.3
  collection: ^1.19.1
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.5
  data_table_2: ^2.7.2
  connectivity_plus: ^7.3.1
  device_info_plus: ^13.2.0
  file_picker: ^12.1.1
  flutter_native_splash: ^2.4.8



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  hive_generator: ^2.0.1
  build_runner: ^2.4.13



flutter:
  uses-material-design: true

  # Folders
  assets:
  - assets/icons/
  - assets/animations/
  - assets/images/

  # Fonts
  fonts:
    - family: 'DMSans'
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700